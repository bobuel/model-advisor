name: Check research sources
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-watch
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - run: node maintenance/check-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-review-report
          path: data/source-check.local.json
          retention-days: 7
